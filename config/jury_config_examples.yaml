# Jury LLM 模型配置示例
# 这个文件展示了各种不同的配置方案

# ============================================================================
# 示例 1: 所有评委使用相同模型（最简单）
# ============================================================================
# judge_models:
#   chief: "qwen-max"
#   logic: "qwen-max"
#   expression: "qwen-max"
#   utility: "qwen-max"
#   moral: "qwen-max"

# ============================================================================
# 示例 2: 根据评委职责分配不同性能的模型（推荐）
# ============================================================================
# judge_models:
#   chief: "qwen-max"         # 首席法官 - 用最强模型
#   logic: "qwen-plus"        # 逻辑评委 - 需要强推理能力
#   expression: "qwen-turbo"  # 表达评委 - 快速响应即可
#   utility: "qwen-max"       # 实用评委 - 需要深度分析
#   moral: "qwen-plus"        # 道德评委 - 平衡性能

# ============================================================================
# 示例 3: 成本优化配置（使用更便宜的模型）
# ============================================================================
# judge_models:
#   chief: "qwen-plus"
#   logic: "qwen-turbo"
#   expression: "qwen-turbo"
#   utility: "qwen-turbo"
#   moral: "qwen-turbo"

# ============================================================================
# 示例 4: 质量优先配置（全部使用最强模型）
# ============================================================================
# judge_models:
#   chief: "qwen-max"
#   logic: "qwen-max"
#   expression: "qwen-max"
#   utility: "qwen-max"
#   moral: "qwen-max"

# ============================================================================
# 示例 5: 混合使用多个 AI 提供商
# ============================================================================
# 需要配置相应的 API Key（在 .env 文件中）
# judge_models:
#   chief: "qwen-max"                          # DashScope
#   logic: "anthropic/claude-3.5-sonnet"      # OpenRouter
#   expression: "qwen-turbo"                  # DashScope
#   utility: "openai/gpt-4"                   # OpenRouter
#   moral: "qwen-plus"                        # DashScope

# ============================================================================
# 可用的 DashScope 模型
# ============================================================================
# qwen-max    - 最强大，推理能力最好，适合复杂任务
# qwen-plus   - 平衡性能和成本，适合大多数任务
# qwen-turbo  - 最快速，成本最低，适合简单任务

# ============================================================================
# 可用的 OpenRouter 模型（需要 OPENROUTER_API_KEY）
# ============================================================================
# anthropic/claude-3.5-sonnet  - Claude 最新模型
# openai/gpt-4                 - GPT-4
# openai/gpt-3.5-turbo        - GPT-3.5
# google/gemini-pro           - Gemini Pro
# 更多模型见: https://openrouter.ai/models
